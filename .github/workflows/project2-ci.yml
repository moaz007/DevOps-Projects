name: Project 2 CI

on:
  push:
    branches: ['**']
    paths:
      - '02-flask-github-actions-ghcr-cicd/**'
      - '.github/workflows/project2-ci.yml'
  pull_request:
    paths:
      - '02-flask-github-actions-ghcr-cicd/**'
      - '.github/workflows/project2-ci.yml'

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: 02-flask-github-actions-ghcr-cicd

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 02-flask-github-actions-ghcr-cicd/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Compute image variables
        id: vars
        shell: bash
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$owner_lc" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push events only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./02-flask-github-actions-ghcr-cicd
          file: ./02-flask-github-actions-ghcr-cicd/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/02-flask-github-actions-ghcr-cicd:latest
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/02-flask-github-actions-ghcr-cicd:sha-${{ steps.vars.outputs.short_sha }}